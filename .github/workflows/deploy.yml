name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish BookCatalog/BookCatalog.csproj -c Release -o release

      - name: Fix base href + service-worker base for a GitHub Pages project site
        run: |
          set -e
          BASE="/${{ github.event.repository.name }}/"
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE}\" />|" release/wwwroot/index.html
          grep -q "<base href=\"${BASE}\" />" release/wwwroot/index.html \
            || { echo "::error::base href was not rewritten to ${BASE} - check the <base> tag in wwwroot/index.html"; exit 1; }
          sed -i "s|const base = \"/\";|const base = \"${BASE}\";|" release/wwwroot/service-worker.js

      - name: SPA fallback + disable Jekyll processing
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
