<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Déjà Dans la Bibli</title>
    <meta name="theme-color" content="#ffffff" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="BookCatalog.styles.css" rel="stylesheet" /> -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-maskable-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-maskable-512.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <div id="pwa-update-ui" hidden>
        <span>Une nouvelle version est disponible.</span>
        <button type="button" id="pwa-update-reload">Mettre à jour</button>
        <button type="button" id="pwa-update-dismiss" aria-label="Ignorer">🗙</button>
    </div>

    <script src="js/imageTools.js"></script>
    <script src="js/imageCropper.js"></script>
    <script src="js/barcodeScanner.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        (function () {
            if (!('serviceWorker' in navigator)) {
                return;
            }

            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(registration => {
                const banner = document.getElementById('pwa-update-ui');
                const reloadButton = document.getElementById('pwa-update-reload');
                const dismissButton = document.getElementById('pwa-update-dismiss');

                function showBanner(worker) {
                    if (!worker) {
                        return;
                    }
                    banner.hidden = false;
                    reloadButton.onclick = () => {
                        reloadButton.disabled = true;
                        worker.postMessage('skipWaiting');
                    };
                    dismissButton.onclick = () => { banner.hidden = true; };
                }

                // An update was already downloaded and is waiting from a previous visit.
                if (registration.waiting && navigator.serviceWorker.controller) {
                    showBanner(registration.waiting);
                }

                // A new worker started installing during this visit.
                registration.addEventListener('updatefound', () => {
                    const installing = registration.installing;
                    if (!installing) {
                        return;
                    }
                    installing.addEventListener('statechange', () => {
                        if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                            showBanner(installing);
                        }
                    });
                });

                // The new worker took control: reload once to pick up the new assets.
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (refreshing) {
                        return;
                    }
                    refreshing = true;
                    window.location.reload();
                });

                // Re-check for updates when the app regains focus, and hourly.
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        registration.update().catch(() => { });
                    }
                });
                setInterval(() => registration.update().catch(() => { }), 60 * 60 * 1000);
            });
        })();
    </script>
</body>

</html>
